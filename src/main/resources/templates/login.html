<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<nav class="navbar">
    <div class="container">

        <a class="brand" href="#">
            <span class="brand-mark">E</span>
            <span>EventHub</span>
        </a>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="#" class="btn btn-primary btn-sm">Register</a></li>
        </ul>
    </div>
</nav>

<main>
    <div class="container">

        <div class="auth-wrapper">

            <div class="card auth-card">

                <h1>Welcome back</h1>
                <p class="subtitle">Log in to book events or manage your own.</p>

                <form action="#" method="post">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address">
                    </div>

                    <div class="form-group" >
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Your password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Log in</button>

                </form>

                <p class="auth-footer">New here? <a href="#">Create an account</a></p>

            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        &copy; 2026 EventHub &middot; Event Booking &amp; Management Platform
    </div>
</footer>

</body>
</html>
