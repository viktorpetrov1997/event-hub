<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | EventHub</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<nav class="navbar">
    <div class="container">

        <a class="brand" href="#">
            <span class="brand-mark">E</span>
            <span>EventHub</span>
        </a>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="#" class="btn btn-primary btn-sm">Register</a></li>
        </ul>
    </div>
</nav>

<main>
    <div class="container">

        <div class="auth-wrapper">

            <div class="card auth-card">

                <h1>Create your account</h1>
                <p class="subtitle">It takes less than a minute.</p>

                <form action="#" method="post">

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="e.g. dev42">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email address">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="At least 8 characters">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password">
                    </div>

                    <div class="form-group">

                        <label>I want to join as</label>

                        <div class="role-options">
                            <label class="role-option">
                                <input type="radio" name="role" value="ATTENDEE">
                                <strong>Attendee</strong>
                                <span>Browse and book events</span>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="ORGANIZER">
                                <strong>Organizer</strong>
                                <span>Create and manage events</span>
                            </label>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Register</button>

                </form>

                <p class="auth-footer">Already registered? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        &copy; 2026 EventHub &middot; Event Booking &amp; Management Platform
    </div>
</footer>

</body>
</html>
